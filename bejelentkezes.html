<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bejelentkezés | MOSLY DELIVERY</title>
    <meta name="description" content="MOSLY DELIVERY belépés dolgozók és futárok számára." />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/auth.js"></script>
  </head>
  <body class="dashboard-body">
    <main class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="brand" aria-label="Mosly Delivery főoldal" style="justify-content:center; margin-bottom: 16px;">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M5 15V8.5C5 6.567 6.567 5 8.5 5H15.5C17.433 5 19 6.567 19 8.5V15H5Z" fill="white"/><path d="M7.5 15V10.5H16.5V15H7.5Z" fill="#1E5C54" fill-opacity="0.3"/><path d="M8.5 8.2L10.6 6.5L12.4 8.5L14.6 6.5L16.5 8.2" stroke="#1E5C54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span>MOSLY DELIVERY</span>
          </a>
          <h1>Bejelentkezés</h1>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="input-group">
            <label for="email">E-mail</label>
            <input class="input" id="email" name="email" type="email" placeholder="pelda@email.com" required />
          </div>

          <div class="input-group">
            <label for="password">Jelszó</label>
            <input class="input" id="password" name="password" type="password" placeholder="••••••••" required />
          </div>

          <div class="progress-box" id="loginProgress">Bejelentkezés folyamatban...</div>
          <div id="loginMessage" class="alert" role="status" aria-live="polite"></div>

          <button class="btn btn-primary" type="submit">BEJELENTKEZÉS</button>
        </form>
      </div>
    </main>

    <script type="module">
      import { setupLoginForm } from './js/auth.js';
      setupLoginForm();
    </script>
  </body>
</html>
